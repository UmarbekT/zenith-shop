<!doctype html>
<html lang="uz">
<head>

  <title>Zenith Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="Zenith bosh sahifa">
    <span class="brand-emblem">Z</span>
    <span class="brand-copy"><b>ZENITH</b><small>TIMEPIECES</small></span>
  </a>
</header>

<main class="auth-shell">
  <div class="auth-card auth-form-card">
    <div class="overline"><span></span> CREATE ACCOUNT</div>
    <h2>Ro‘yxatdan o‘tish</h2>
    <form id="registerForm">
      <label>
        <span>Ism</span>
        <input id="registerName" type="text" placeholder="Ismingiz" required>
      </label>
      <label>
        <span>Email</span>
        <input id="registerEmail" type="email" placeholder="you@example.com" required>
      </label>
      <label>
        <span>Parol</span>
        <input id="registerPassword" type="password" placeholder="Parolingiz" required>
      </label>
      <button class="btn" type="submit">Ro‘yxatdan o‘tish</button>
    </form>
    <p class="switch-link">Allaqachon hisobingiz bormi? <a href="login.html">Kirish</a></p>
    <p id="registerMessage"></p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
